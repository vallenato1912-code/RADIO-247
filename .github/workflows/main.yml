name: RADIO-247-EN-VIVO
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Transmitir a YouTube
        run: |
          ffmpeg -re -f lavfi -i color=c=0xB50000:s=1280x720:r=15 -i https://ny1.radio.primcast.com/8342/stream -c:v libx264 -preset veryfast -b:v 1000k -maxrate 1000k -bufsize 2000k -r 15 -g 30 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -f flv rtmp://a.rtmp.youtube.com/live2/a4ah-2jmc-fwe0-8exz-d85x
